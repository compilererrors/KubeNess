apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubeness.observer" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeness.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeness.observer" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeness.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
spec:
  # One owner of watchers, rule loop and SQLite. Recreate makes sure the old pod
  # is gone before the new one opens the same database.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubeness.observerSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeness.observerSelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "kubeness.observer" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/kubeness/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          # Generous timeouts: the model pod can keep the node's CPUs busy.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.observer.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kubeness
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.actions.enabled .Values.executor.enabled }}
            - name: executor-token
              mountPath: /var/run/kubeness/executor
              readOnly: true
            {{- end }}
            {{- if .Values.notifications.enabled }}
            - name: notifier-token
              mountPath: /var/run/kubeness/notifier
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kubeness.observer" . }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kubeness.observer" . }}-data
        - name: tmp
          emptyDir: {}
        {{- if and .Values.actions.enabled .Values.executor.enabled }}
        - name: executor-token
          secret:
            secretName: {{ include "kubeness.fullname" . }}-executor-token
            defaultMode: 0440
        {{- end }}
        {{- if .Values.notifications.enabled }}
        - name: notifier-token
          secret:
            secretName: {{ include "kubeness.notifier" . }}-token
            defaultMode: 0440
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeness.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeness.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.serviceType }}
  selector:
    {{- include "kubeness.observerSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.servicePort }}
      targetPort: http
