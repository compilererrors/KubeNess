# Faults for the scheduling and OOM rules.
---
# Requests more CPU than any node has: Unschedulable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sched-huge
  namespace: lab
  labels: {lab-fault: sched-huge}
spec:
  replicas: 1
  selector: {matchLabels: {app: sched-huge}}
  template:
    metadata: {labels: {app: sched-huge}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: "1000"}
---
# Exceeds its memory limit once per pod, then runs: the marker lives in an emptyDir,
# which survives container restarts but not a new pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-once
  namespace: lab
  labels: {lab-fault: oom-once}
spec:
  replicas: 1
  selector: {matchLabels: {app: oom-once}}
  template:
    metadata: {labels: {app: oom-once}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "if [ -f /work/done ]; then exec sleep 3600; fi; touch /work/done; exec tail /dev/zero"]
          resources:
            limits: {memory: 32Mi}
          volumeMounts:
            - {name: work, mountPath: /work}
      volumes:
        - name: work
          emptyDir: {}
---
# Never ready behind a Service: readiness evidence shows zero ready endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-unready
  namespace: lab
  labels: {lab-fault: svc-unready}
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector: {matchLabels: {app: svc-unready}}
  template:
    metadata: {labels: {app: svc-unready}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe:
            exec: {command: ["false"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: svc-unready
  namespace: lab
  labels: {lab-fault: svc-unready}
spec:
  selector: {app: svc-unready}
  ports:
    - {port: 80, targetPort: 8080}
---
# Healthy workload whose image reference changes during the test: a digest item,
# never an immediate notification. Both references resolve to the cached image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digest-roll
  namespace: lab
  labels: {lab-fault: digest-roll}
spec:
  replicas: 1
  selector: {matchLabels: {app: digest-roll}}
  template:
    metadata: {labels: {app: digest-roll}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
