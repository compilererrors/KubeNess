# Webhook sink for the lab: records what the notifier delivers so the e2e suite can
# check it. POST /hook and /heartbeat record a request; GET /received lists them;
# DELETE /received clears them; POST /mode {"fail": true} answers 503 until reset.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-sink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sink
  namespace: lab-sink
data:
  sink.py: |
    import json, threading, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    lock = threading.Lock()
    received, mode = [], {"fail": False}

    class Handler(BaseHTTPRequestHandler):
        def _reply(self, code, body=b"", ctype="text/plain"):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
            if self.path == "/mode":
                with lock:
                    mode.update(json.loads(body or b"{}"))
                return self._reply(200, b"ok")
            if self.path not in ("/hook", "/heartbeat"):
                return self._reply(404)
            with lock:
                failing = mode["fail"]
                received.append({"path": self.path, "at": time.time(), "failed": failing,
                                 "headers": {k: v for k, v in self.headers.items()},
                                 "body": body.decode(errors="replace")})
            self._reply(503 if failing else 200, b"unavailable" if failing else b"ok")

        def do_GET(self):
            if self.path == "/received":
                with lock:
                    return self._reply(200, json.dumps(received).encode(), "application/json")
            self._reply(200 if self.path == "/healthz" else 404, b"ok")

        def do_DELETE(self):
            with lock:
                received.clear()
            self._reply(200, b"ok")

        def log_message(self, *args):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  namespace: lab-sink
spec:
  replicas: 1
  selector:
    matchLabels: {app: sink}
  template:
    metadata:
      labels: {app: sink}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sink
          # The observer image is already loaded into kind and has Python; only the
          # script from the ConfigMap runs.
          image: kubeness:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-B", "-u", "/app/sink.py"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app}
      volumes:
        - name: app
          configMap: {name: sink}
---
apiVersion: v1
kind: Service
metadata:
  name: sink
  namespace: lab-sink
spec:
  selector: {app: sink}
  ports:
    - {name: http, port: 8080, targetPort: http}
