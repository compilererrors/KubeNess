# Fault for the stage 6 (Act) e2e suite: a crash loop to restart with approval.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-crasher
  namespace: lab
  labels: {lab-fault: act-crasher}
spec:
  replicas: 1
  selector: {matchLabels: {app: act-crasher}}
  template:
    metadata: {labels: {app: act-crasher}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 3; exit 1"]
---
# Healthy at revision 1; the test then sets a missing image (revision 2) and rolls back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-rollback
  namespace: lab
  labels: {lab-fault: act-rollback}
spec:
  replicas: 1
  selector: {matchLabels: {app: act-rollback}}
  template:
    metadata: {labels: {app: act-rollback}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
