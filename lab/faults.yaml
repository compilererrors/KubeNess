# Known faults for the lab namespace. Each one should open exactly one incident.
#   kubectl --context kind-kubeness apply -f lab/faults.yaml
---
# Repeated restart: exits after a few seconds, kubelet backs off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
  namespace: lab
spec:
  replicas: 1
  selector: {matchLabels: {app: crasher}}
  template:
    metadata: {labels: {app: crasher}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 5; echo 'fatal: config missing' >&2; exit 1"]
---
# Image pull failure: the tag does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: lab
spec:
  replicas: 1
  selector: {matchLabels: {app: bad-image}}
  template:
    metadata: {labels: {app: bad-image}}
    spec:
      containers:
        - name: app
          image: busybox:does-not-exist-0000
          command: ["sleep", "3600"]
---
# Readiness failure: running, but the probe never succeeds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: never-ready
  namespace: lab
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  selector: {matchLabels: {app: never-ready}}
  template:
    metadata: {labels: {app: never-ready}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ready"]}
            periodSeconds: 5
---
# Healthy control: must never open an incident.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy
  namespace: lab
spec:
  replicas: 2
  selector: {matchLabels: {app: healthy}}
  template:
    metadata: {labels: {app: healthy}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
